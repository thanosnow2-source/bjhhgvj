<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verificación Exitosa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(145deg, #0b1a33 0%, #1a3a6b 45%, #2a5f9e 100%);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(64, 164, 255, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(30, 200, 120, 0.20) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(0, 200, 255, 0.12) 0%, transparent 40%);
      pointer-events: none;
    }

    /* Partículas flotantes */
    body::after {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255, 255, 255, 0.10), transparent),
        radial-gradient(2px 2px at 60% 70%, rgba(255, 255, 255, 0.08), transparent),
        radial-gradient(2px 2px at 80% 20%, rgba(255, 255, 255, 0.12), transparent);
      background-size: 200px 200px;
      animation: floatParticles 25s linear infinite;
      pointer-events: none;
      opacity: 0.7;
    }

    @keyframes floatParticles {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(40px, 30px);
      }
    }

    .success-container {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 30px 60px rgba(0, 10, 30, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: riseUp 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      z-index: 2;
    }

    @keyframes riseUp {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.96);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .success-card {
      background: #ffffff;
      border-radius: 32px;
      padding: 44px 28px 36px;
      text-align: center;
    }

    /* Check circular animado */
    .check-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #059669);
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 40px rgba(16, 185, 129, 0.4);
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
      position: relative;
    }

    .check-circle::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(16, 185, 129, 0.3);
      animation: ripple 2s ease-out infinite;
    }

    .check-circle::after {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 2px solid rgba(16, 185, 129, 0.15);
      animation: ripple 2s ease-out infinite 0.5s;
    }

    @keyframes ripple {
      0% {
        transform: scale(0.9);
        opacity: 1;
      }

      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    @keyframes popIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .check-circle svg {
      width: 60px;
      height: 60px;
    }

    .check-circle svg path {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawCheck 0.6s ease-out 0.7s forwards;
    }

    @keyframes drawCheck {
      to {
        stroke-dashoffset: 0;
      }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #0b1a33;
      letter-spacing: -0.4px;
      margin-bottom: 10px;
      animation: fadeUp 0.5s ease 0.9s both;
    }

    .subtitle {
      color: #4b5e77;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
      animation: fadeUp 0.5s ease 1s both;
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .info-box {
      background: #f2f6fc;
      border-radius: 20px;
      padding: 18px 20px;
      margin-bottom: 24px;
      text-align: left;
      animation: fadeUp 0.5s ease 1.1s both;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 14px;
    }

    .info-row:not(:last-child) {
      border-bottom: 1px solid #e2e8f0;
    }

    .info-label {
      color: #64748b;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-value {
      color: #0b1a33;
      font-weight: 600;
      font-size: 13px;
    }

    .badge-success {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: #d1fae5;
      color: #065f46;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      animation: fadeUp 0.5s ease 1.2s both;
    }

    .badge-success::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: badgePulse 1.5s infinite;
    }

    @keyframes badgePulse {
      0% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .btn-continue {
      width: 100%;
      padding: 16px;
      margin-top: 4px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 40px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
      animation: fadeUp 0.5s ease 1.3s both;
    }

    .btn-continue:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(37, 99, 235, 0.5);
    }

    .btn-continue:active {
      transform: scale(0.97);
    }

    .footer-text {
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
      animation: fadeUp 0.5s ease 1.4s both;
    }

    @media (max-width: 480px) {
      .success-container {
        padding: 6px;
        border-radius: 32px;
      }

      .success-card {
        padding: 34px 20px 28px;
      }

      h1 {
        font-size: 22px;
      }

      .check-circle {
        width: 90px;
        height: 90px;
      }

      .check-circle svg {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>

<body>
  <div class="success-container">
    <div class="success-card">

      <div class="check-circle">
        <svg viewBox="0 0 52 52" fill="none">
          <path d="M14 27 L22 35 L38 18" stroke="white" stroke-width="5" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </div>

      <h1>¡Verificación Exitosa!</h1>
      <p class="subtitle">Tu identidad ha sido confirmada correctamente.<br>Bienvenido al sistema.</p>

      <div class="info-box">
        <div class="info-row">
          <span class="info-label">🔐 Estado</span>
          <span class="info-value">Verificado</span>
        </div>
        <div class="info-row">
          <span class="info-label">🕐 Fecha</span>
          <span class="info-value" id="fechaActual">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">🌐 IP</span>
          <span class="info-value" id="ipActual">Cargando...</span>
        </div>
      </div>

      <span class="badge-success">SESIÓN ACTIVA</span>

      <button class="btn-continue" onclick="continuar()">
        ➜ Continuar al Panel
      </button>

      <p class="footer-text">Sistema de verificación biométrica · Seguro y cifrado</p>

    </div>
  </div>

  <script>
    // Fecha actual
    document.getElementById('fechaActual').textContent =
      new Date().toLocaleString('es-ES', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });

    // IP
    fetch('https://api.ipify.org?format=json')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById('ipActual').textContent = d.ip || 'No disponible';
      })
      .catch(function () {
        document.getElementById('ipActual').textContent = 'No disponible';
      });

    // Acción del botón continuar
    function continuar() {
      // 👉 Cambia esta URL por la de tu panel/dashboard real
      window.location.href = 'eleccion.html';
    }
  </script>
</body>

</html>
